<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>depto newsletter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace;
      background: #f9f9f7;
      color: #222;
      padding: 2rem 1rem;
    }
    .page { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: normal; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 2rem; }
    hr { border: none; border-top: 1px solid #ddd; margin: 1.5rem 0; }

    .entry {
      border-left: 2px solid #ccc;
      padding: 0 0 1.5rem 1rem;
      position: relative;
    }
    .entry:last-child { padding-bottom: 0; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #aaa;
      position: absolute;
      left: -5px; top: 6px;
    }
    .entry-date { font-size: 11px; color: #aaa; margin-bottom: 4px; }
    .entry-text { font-size: 14px; line-height: 1.6; margin-top: 4px; }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .tag-visita   { background: #dbeafe; color: #1e40af; }
    .tag-compra   { background: #dcfce7; color: #166534; }
    .tag-limpieza { background: #fef9c3; color: #854d0e; }
    .tag-otro     { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Depto 501</h1>
    <p class="subtitle">Actualizaciones del hogar</p>
    <hr>
    <div id="entries">cargando...</div>
  </div>

  <script>
    fetch('data.json?nocache=' + Date.now())
      .then(r => r.json())
      .then(entries => {
        const div = document.getElementById('entries');
        if (!entries.length) {
          div.innerHTML = '<p style="color:#aaa;font-size:13px">sin actualizaciones aún.</p>';
          return;
        }
        div.innerHTML = entries.map(e => `
          <div class="entry">
            <div class="dot"></div>
            <div class="entry-date">${e.fecha}</div>
            <span class="tag tag-${e.tag}">${e.tag}</span>
            <p class="entry-text">${e.texto}</p>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
